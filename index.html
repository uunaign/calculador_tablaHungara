    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="formContainer">


        <form>
            <h1 id="formTitle">Calculadora tabla hungara</h1>
            <div class="radio-inputs">
                <label class="radio">
                    <input type="radio" name="tipo_pista" value="indoor" checked>
                    <span class="name">Pista cubierta</span>
                </label>
                <label class="radio">
                    <input type="radio" name="tipo_pista" value="outdoor">
                    <span class="name">Aire libre</span>
                </label>
            </div>

            <div class="radio-inputs">
                <label class="radio">
                    <input type="radio" name="genero" value="hombres" checked>
                    <span class="name">Hombre</span>
                </label>
                <label class="radio">
                    <input type="radio" name="genero" value="mujeres">
                    <span class="name">Mujer</span>
                </label>
            </div>

            <div class="form-group">
                <select id="prueba-select" class="select-prueba">
                </select>
            </div>

            <div class="calculadoraPuntos">
                <input class="numerosInput" type="text" name="marca" id="marca" placeholder="marca (solo números)">
                <input class="numerosInput" type="text" name="resultado" id="resultado" readonly>
            </div>

            <div class="actionContainer">
                <!-- <button id="switchButton" >Puntos a marca <img src="assets/iconoSwitch.png"></button> -->
                <input type="button" value="Guardar" id="saveButton">
            </div>


            <div id="divider"></div>

            <div id="savedList" aria-label="Resultados guardados">
                <ul id="savedItems"></ul>
                <p id="savedListMessage" role="status">Pulsa "Guardar" para añadir resultados.</p>
            </div>
            <div class="sumaPuntos">
                <h2>Suma de Puntos</h2>
                <input class="numerosInput" type="text" name="resultadoPuntos" id="resultadoPuntos" readonly>
            </div>

        </form>
    </div>

</body>

    // ============================================================
    // 4. ACTUALIZAR LISTA DE PRUEBAS
    // ============================================================

    function actualizarPruebas() {
        const radioPista = document.querySelector('input[name="tipo_pista"]:checked');
        const radioGenero = document.querySelector('input[name="genero"]:checked');

        const pista = radioPista ? radioPista.value : 'indoor';
        const genero = radioGenero ? radioGenero.value : 'hombres';

        if (pruebasData[pista] && pruebasData[pista][genero]) {
            const lista = pruebasData[pista][genero];

            selectPrueba.innerHTML = '';

            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "Selecciona una prueba";
            defaultOption.disabled = true;
            defaultOption.selected = true;

            selectPrueba.appendChild(defaultOption);

            lista.forEach(prueba => {
                const option = document.createElement('option');

                option.value = prueba;
                option.textContent = prueba;

                selectPrueba.appendChild(option);
            });
        }

        limpiarInputs();
    }


    // ============================================================
    // 5. CLASIFICADOR DE PRUEBAS
    // ============================================================

    function obtenerTipoPrueba(nombrePrueba) {
        if (!nombrePrueba) {
            return 'segundos';
        }

        const prueba = nombrePrueba.toLowerCase();

        if (
            prueba.includes('salto') ||
            prueba.includes('lanzamiento') ||
            prueba.includes('peso') ||
            prueba.includes('pesado')
        ) {
            return 'distancia';
        }

        if (
            prueba.includes('800') ||
            prueba.includes('1000') ||
            prueba.includes('1500') ||
            prueba.includes('milla') ||
            prueba.includes('2000') ||
            prueba.includes('3000') ||
            prueba.includes('5000') ||
            prueba.includes('10000') ||
            prueba.includes('maratón') ||
            prueba.includes('marcha') ||
            prueba.includes('ruta') ||
            prueba.includes('medio maratón') ||
            prueba.includes('obstáculos') ||
            prueba.includes('20 km') ||
            prueba.includes('35 km')
        ) {
            return 'minutos';
        }

        return 'segundos';
    }


    // ============================================================
    // 6. LIMPIAR INPUTS
    // ============================================================

    function limpiarInputs() {
        if (inputMarca) {
            inputMarca.value = '';
        }

        if (inputResultado) {
            inputResultado.value = '';
        }
    }


    // ============================================================
    // 7. FORMATEO DE MARCA
    // ============================================================

    if (inputMarca) {
        inputMarca.addEventListener('input', (e) => {
            const pruebaSeleccionada = selectPrueba.value;

            if (!pruebaSeleccionada) {
                return;
            }

            const tipo = obtenerTipoPrueba(pruebaSeleccionada);

            let raw = e.target.value.replace(/\D/g, '');

            if (!raw) {
                e.target.value = '';
                inputResultado.value = '';
                return;
            }

            let formatted = '';

            if (tipo === 'distancia' || tipo === 'segundos') {

                if (raw.length <= 2) {
                    formatted = raw;
                } else {
                    formatted =
                        raw.slice(0, -2) +
                        '.' +
                        raw.slice(-2);
                }

            } else if (tipo === 'minutos') {

                if (raw.length <= 2) {
                    formatted = raw;

                } else if (raw.length <= 4) {

                    formatted =
                        raw.slice(0, -2) +
                        '.' +
                        raw.slice(-2);

                } else {

                    formatted =
                        raw.slice(0, -4) +
                        "'" +
                        raw.slice(-4, -2) +
                        '.' +
                        raw.slice(-2);
                }
            }

            e.target.value = formatted;

            calcularPuntos();
        });
    }


    // ============================================================
    // 8. CONVERTIR LA MARCA A UN NÚMERO
    // ============================================================

    function convertirMarcaAValor(marca) {
        if (!marca) {
            return null;
        }

        let valor = marca.trim();

        if (!valor) {
            return null;
        }

        valor = valor.replace(',', '.');

        // Formato HH:MM:SS.xx
        if (valor.includes(':')) {
            const partes = valor.split(':');

            if (partes.length === 3) {
                const horas = parseFloat(partes[0]);
                const minutos = parseFloat(partes[1]);
                const segundos = parseFloat(partes[2]);

                if (
                    Number.isFinite(horas) &&
                    Number.isFinite(minutos) &&
                    Number.isFinite(segundos)
                ) {
                    return horas * 3600 + minutos * 60 + segundos;
                }
            }

            if (partes.length === 2) {
                const minutos = parseFloat(partes[0]);
                const segundos = parseFloat(partes[1]);

                if (
                    Number.isFinite(minutos) &&
                    Number.isFinite(segundos)
                ) {
                    return minutos * 60 + segundos;
                }
            }
        }

        // Formato X'YY.ZZ
        if (valor.includes("'")) {
            const partes = valor.split("'");

            const minutos = parseFloat(partes[0]);
            const segundos = parseFloat(partes[1]);

            if (
                Number.isFinite(minutos) &&
                Number.isFinite(segundos)
            ) {
                return minutos * 60 + segundos;
            }
        }

        const numero = parseFloat(valor);

        return Number.isFinite(numero)
            ? numero
            : null;
    }


    // ============================================================
    // 9. CALCULAR PUNTOS
    // ============================================================

    function calcularPuntos() {
        if (!selectPrueba || !inputMarca || !inputResultado) {
            return null;
        }

        const prueba = selectPrueba.value;

        if (!prueba) {
            inputResultado.value = '';
            return null;
        }

        const radioPista = document.querySelector(
            'input[name="tipo_pista"]:checked'
        );

        const radioGenero = document.querySelector(
            'input[name="genero"]:checked'
        );

        const pista = radioPista
            ? radioPista.value
            : 'indoor';

        const genero = radioGenero
            ? radioGenero.value
            : 'hombres';

        const marca = convertirMarcaAValor(inputMarca.value);

        if (marca === null || marca <= 0) {
            inputResultado.value = '';
            return null;
        }

        const coef =
            coeficientesPuntos?.[pista]?.[genero]?.[prueba];

        /*
         * Estas pruebas no tienen una única marca que pueda
         * convertirse directamente en puntos.
         *
         * Los combinados se calculan sumando las puntuaciones
         * de sus pruebas individuales.
         *
         * El lanzamiento de pesado tampoco aparece en las
         * tablas 2025 proporcionadas.
         */
        if (!coef) {
            inputResultado.value = '—';
            return null;
        }

        const tipo = obtenerTipoPrueba(prueba);

        /*
         * En carreras, cuando el tiempo supera la marca base
         * de la fórmula, no se conceden puntos.
         *
         * El vértice de la parábola está en:
         *
         *     marcaBase = -B
         */
        if (tipo !== 'distancia') {
            const marcaBase = -coef.b;

            if (marca >= marcaBase) {
                inputResultado.value = '0';
                return 0;
            }
        }

        /*
         * Fórmula:
         *
         * P = floor(A * (marca + B)^2 + C)
         */
        let puntos =
            Math.floor(
                coef.a *
                Math.pow(marca + coef.b, 2) +
                coef.c +
                1e-9
            );

        if (!Number.isFinite(puntos)) {
            inputResultado.value = '';
            return null;
        }

        if (puntos < 0) {
            puntos = 0;
        }

        /*
         * Las tablas proporcionadas llegan hasta 1400 puntos.
         */
        if (puntos > 1400) {
            puntos = 1400;
        }

        inputResultado.value = puntos;

        return puntos;
    }


    // ============================================================
    // 10. SUMA DE PUNTOS
    // ============================================================

    function actualizarSumaPuntos() {
        if (!resultadoPuntos) {
            return;
        }

        let suma = 0;

        document.querySelectorAll('.savedItem').forEach(item => {
            const puntos = parseInt(item.dataset.puntos, 10);

            if (Number.isFinite(puntos)) {
                suma += puntos;
            }
        });

        resultadoPuntos.value = suma;
    }


    // ============================================================
    // 11. EVENTOS DE LOS RADIOS
    // ============================================================

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', actualizarPruebas);
    });


    // ============================================================
    // 12. CAMBIO DE PRUEBA
    // ============================================================

    if (selectPrueba) {
        selectPrueba.addEventListener('change', () => {
            limpiarInputs();
        });
    }


    // ============================================================
    // 13. GUARDAR RESULTADO
    // ============================================================

    saveButton.addEventListener('click', () => {

        const prueba = selectPrueba.value;
        const marca = inputMarca.value.trim();

        if (!prueba) {
            savedListMessage.textContent =
                'Selecciona una prueba antes de guardar.';

            selectPrueba.focus();

            return;
        }

        if (!marca) {
            savedListMessage.textContent =
                'Introduce una marca antes de guardar.';

            inputMarca.focus();

            return;
        }

        const puntos = calcularPuntos();

        if (puntos === null) {
            savedListMessage.textContent =
                'Esta prueba no tiene una fórmula de puntuación directa disponible.';

            return;
        }

        const item = document.createElement('li');

        item.className = 'savedItem';
        item.dataset.puntos = puntos;


        const pruebaTexto = document.createElement('span');

        pruebaTexto.className =
            'savedItemPrueba';

        pruebaTexto.textContent =
            prueba;


        const marcaTexto = document.createElement('span');

        marcaTexto.textContent =
            `Marca: ${marca}`;


        const puntuacionTexto = document.createElement('span');

        puntuacionTexto.textContent =
            `Puntuación: ${puntos}`;


        const eliminarButton = document.createElement('button');

        eliminarButton.className =
            'deleteSavedItem';

        eliminarButton.type =
            'button';

        eliminarButton.textContent =
            'Eliminar';

        eliminarButton.setAttribute(
            'aria-label',
            `Eliminar resultado de ${prueba}`
        );


        eliminarButton.addEventListener('click', () => {

            item.remove();

            if (savedItems.children.length === 0) {
                savedListMessage.textContent =
                    'Pulsa "Guardar" para añadir resultados.';
            }

            actualizarSumaPuntos();
        });


        item.append(
            pruebaTexto,
            marcaTexto,
            puntuacionTexto,
            eliminarButton
        );

        savedItems.appendChild(item);

        savedListMessage.textContent = '';

        actualizarSumaPuntos();

        limpiarInputs();
    });


    // ============================================================
    // 14. CARGA INICIAL
    // ============================================================

    actualizarPruebas();
</script>
